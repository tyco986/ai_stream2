# bash servers/generator/scripts/3_generate.sh --config stgcnpp_rtmpose_vis_rtsp

generator: StgcnppRtmposeVisRTSPGenerator
pipeline_name: stgcnpp_rtmpose_vis_rtsp
config_save_dir: /root/configs/generator/stgcnpp_rtmpose_vis_rtsp
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.4
sgie:
  interval: 1
  model_dir: /root/models/trt/rtmpose-t-body8
stgcnpp:
  interval: 1
  model_dir: /root/models/trt/stgcnpp-ntu60-j
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
  mode: coco17
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
