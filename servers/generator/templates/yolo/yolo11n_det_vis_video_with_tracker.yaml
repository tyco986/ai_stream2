# bash servers/generator/scripts/3_generate.sh --config yolo11n_det_vis_video_with_tracker
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.
# Reference frame: attachments/images/video1.png (1920x1080), main flow is vertical.

generator: DetVisVideoGenerator
pipeline_name: yolo11n_det_vis_video_with_tracker
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo11n.zip
  class_attrs:
    all:
      conf: 0.25
tracker: {class_id: -1}
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
videos:
  - path: /root/attachments/videos/video1.mp4
    width: 1920
    height: 1080
    fps: 25
  - path: /root/attachments/videos/video2.mp4
    width: 1920
    height: 1080
    fps: 25
filesink_output: /root/media/pipeline/yolo11n_det_vis_video_with_tracker
