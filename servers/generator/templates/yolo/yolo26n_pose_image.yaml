# bash servers/generator/scripts/3_generate.sh --config yolo26n_pose_image
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: PoseImageGenerator
pipeline_name: yolo26n_pose_image
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n-pose.zip
  class_attrs:
    all:
      conf: 0.25
analyzer: null
collector:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
images:
  - path: /root/attachments/images/video1.png
    width: 1920
    height: 1080
  - path: /root/attachments/images/video2.png
    width: 1920
    height: 1080
filesink_output: /root/media/pipeline/yolo26n_pose_image
