# bash servers/generator/scripts/3_generate.sh --config yolo11n_det_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.
# Reference frame: attachments/images/video1.png (1920x1080), main flow is vertical.

generator: DetVideoGenerator
config_save_dir: /root/configs/generator/yolo11n_det_video
interval: 50
pgie:
  model_dir: /root/models/trt/yolo11n
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/yolo11n_det_video.mp4
