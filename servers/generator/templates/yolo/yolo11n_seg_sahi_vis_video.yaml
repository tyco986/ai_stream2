# bash servers/generator/scripts/3_generate.sh --config yolo11n_seg_sahi_vis_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: SegSahiVisVideoGenerator
pipeline_name: yolo11n_seg_sahi_vis_video
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo11n-seg.zip
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
collector:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_mask: true
videos:
  - path: /root/attachments/videos/video1.mp4
    width: 1920
    height: 1080
    fps: 25
  - path: /root/attachments/videos/video2.mp4
    width: 1920
    height: 1080
    fps: 25
filesink_output: /root/media/pipeline/yolo11n_seg_sahi_vis_video
sahi:
  preprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  postprocess:
    match_metric: 1
    match_threshold: 0.5
    class_agnostic: false
    enable_merge: true
    two_phase_nmm: true
    prefer_full_frame: true
