# bash servers/generator/scripts/3_generate.sh --config yolo26n_det_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.
# Reference frame: attachments/images/video1.png (1920x1080), main flow is vertical.

generator: DetVideoGenerator
config_save_dir: /root/configs/generator/yolo26n_det_video
interval: 50
pgie:
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    all:
      conf: 0.25
tracker: {class_id: -1}
analyzer:
  streams: [video]
  osd_mode: 2
  template:
    # Full floor ROI so OSD draws a large polygon overlay
    roi_filtering:
      class_id: [-1]
      inverse_roi: 0
      roi:
        - [FLOOR, "160;60;1760;60;1760;1020;160;1020"]
    # Mid-left cluster often denser; threshold low for easy OSD trigger
    overcrowding:
      class_id: [0]
      object_threshold: 5
      time_threshold: 2000
      roi:
        - [CLUSTER, "320;360;980;360;980;760;320;760"]
    # Horizontal mid line; CrossDown / CrossUp for vertical traffic
    # Format: Cx;Cy;Dx;Dy;Ax;Ay;Bx;By (direction then line)
    line_crossing:
      extended: 0
      class_id: [0]
      mode: balanced
      roi:
        - [CrossDown, "960;400;960;680;200;540;1720;540"]
        - [CrossUp, "960;680;960;400;200;540;1720;540"]
    # Vertical reference directions (4 ints: x1;y1;x2;y2)
    direction_detection:
      class_id: [0]
      mode: loose
      roi:
        - [South, "960;400;960;720"]
        - [North, "960;720;960;400"]
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/yolo26n_det_video.mp4
