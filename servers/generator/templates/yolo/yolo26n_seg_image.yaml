# bash servers/generator/scripts/3_generate.sh --config yolo26n_seg_image
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: SegImageGenerator
pipeline_name: yolo26n_seg_image
config_save_dir: /root/configs/generator/yolo26n_seg_image
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo26n-seg
  class_attrs:
    all:
      conf: 0.25
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_mask: true
event_coder: null
input: /root/attachments/images/video1.png
output: /root/outputs/deepstream/yolo26n_seg_image.jpg
