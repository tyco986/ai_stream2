# bash servers/generator/scripts/3_generate.sh --config yolo26n_pose_sahi_rtsp

generator: PoseSahiRTSPGenerator
pipeline_name: yolo26n_pose_sahi_rtsp
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n-pose.zip
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
logger:
  interval: 50
drawer: null
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocesspose:
    class_agnostic: false
    match_metric: 1
    match_threshold: 0.5
    prefer_full_frame: true
    max_detections: -1
    oks_threshold: 0.2
    vis_threshold: 0.0
    num_keypoints: 0
