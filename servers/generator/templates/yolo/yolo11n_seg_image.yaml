# bash servers/generator/scripts/3_generate.sh --config yolo11n_seg_image
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: SegImageGenerator
pipeline_name: yolo11n_seg_image
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo11n-seg.zip
  class_attrs:
    all:
      conf: 0.25
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_mask: true
images:
  - /root/attachments/images/video1.png
  - /root/attachments/images/video2.png
output: /root/outputs/deepstream/yolo11n_seg_image
