# bash servers/generator/scripts/3_generate.sh --config yolo26n_pose_vis_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: PoseVisVideoGenerator
pipeline_name: yolo26n_pose_vis_video
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n-pose.zip
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
videos:
  - path: /root/attachments/videos/video1.mp4
    width: 1920
    height: 1080
    fps: 25
  - path: /root/attachments/videos/video2.mp4
    width: 1920
    height: 1080
    fps: 25
filesink_output: /root/media/pipeline/yolo26n_pose_vis_video
