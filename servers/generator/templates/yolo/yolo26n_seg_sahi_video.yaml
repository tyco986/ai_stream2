# bash servers/generator/scripts/3_generate.sh --config yolo26n_seg_sahi_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: SegSahiVideoGenerator
config_save_dir: /root/configs/generator/yolo26n_seg_sahi_video
interval: 0
pgie:
  model_dir: /root/models/trt/yolo26n-seg
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/yolo26n_seg_sahi_video.mp4
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess:
    match_threshold: 0.5
