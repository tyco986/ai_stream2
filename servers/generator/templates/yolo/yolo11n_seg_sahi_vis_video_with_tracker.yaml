# bash servers/generator/scripts/3_generate.sh --config yolo11n_seg_sahi_vis_video_with_tracker
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: SegSahiVisVideoGenerator
config_save_dir: /root/configs/generator/yolo11n_seg_sahi_vis_video_with_tracker
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo11n-seg
  class_attrs:
    all:
      conf: 0.25
tracker: {class_id: -1}
analyzer: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/yolo11n_seg_sahi_vis_video_with_tracker.mp4
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess:
    match_threshold: 0.5
