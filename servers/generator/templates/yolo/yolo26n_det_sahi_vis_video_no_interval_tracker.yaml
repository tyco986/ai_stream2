# bash servers/generator/scripts/3_generate.sh --config yolo26n_det_sahi_vis_video_no_interval
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: DetSahiVisVideoGenerator
pipeline_name: yolo26n_det_sahi_vis_video_no_interval_tracker
pgie:
  interval: 1
  model_zip: /root/history/export_trt/yolo26n.zip
  class_attrs:
    all:
      conf: 0.25
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer:
  interval: 1
  fade_time: 1
  show_label: true
  show_snap: false
videos:
  - /root/attachments/videos/video1.mp4
  - /root/attachments/videos/video2.mp4
output: /root/outputs/deepstream/yolo26n_det_sahi_vis_video_no_interval_tracker
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_metric: 1
    match_threshold: 0.5
    class_agnostic: false
    enable_merge: true
    two_phase_nmm: true
    prefer_full_frame: true
