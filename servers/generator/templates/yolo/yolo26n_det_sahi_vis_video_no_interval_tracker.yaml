# bash servers/generator/scripts/3_generate.sh --config yolo26n_det_sahi_vis_video_no_interval
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: DetSahiVisVideoGenerator
pipeline_name: yolo26n_det_sahi_vis_video_no_interval_tracker
config_save_dir: /root/configs/generator/yolo26n_det_sahi_vis_video_no_interval_tracker
pgie:
  interval: 1
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    all:
      conf: 0.25
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer:
  interval: 1
  fade_time: 1
  show_label: true
  show_snap: false
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/yolo26n_det_sahi_vis_video_no_interval_tracker.mp4
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess:
    match_threshold: 0.5
