# bash servers/generator/scripts/3_generate.sh --config yolo26n_pose_sahi_image
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: PoseSahiImageGenerator
pipeline_name: yolo26n_pose_sahi_image
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n-pose.zip
  class_attrs:
    all:
      conf: 0.25
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
  mode: coco17
images:
  - /root/attachments/images/video1.png
  - /root/attachments/images/video2.png
output: /root/outputs/deepstream/yolo26n_pose_sahi_image
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocesspose:
    oks_threshold: 0.2
