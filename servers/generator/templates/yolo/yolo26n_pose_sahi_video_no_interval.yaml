# bash servers/generator/scripts/3_generate.sh --config yolo26n_pose_sahi_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: PoseSahiVideoGenerator
pipeline_name: yolo26n_pose_sahi_video_no_interval
pgie:
  interval: 1
  model_zip: /root/history/export_trt/yolo26n-pose.zip
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
logger:
  interval: 1
drawer: null
videos:
  - /root/attachments/videos/video1.mp4
  - /root/attachments/videos/video2.mp4
sahi:
  preprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  postprocess:
    class_agnostic: false
    match_metric: 1
    match_threshold: 0.5
    prefer_full_frame: true
    max_detections: -1
    oks_threshold: 0.2
    vis_threshold: 0.0
    num_keypoints: 0
