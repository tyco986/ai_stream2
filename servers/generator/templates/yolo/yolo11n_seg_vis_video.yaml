# bash servers/generator/scripts/3_generate.sh --config yolo11n_seg_vis_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: SegVisVideoGenerator
pipeline_name: yolo11n_seg_vis_video
config_save_dir: /root/configs/generator/yolo11n_seg_vis_video
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo11n-seg
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_mask: true
event_coder: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/yolo11n_seg_vis_video.mp4
