# bash servers/generator/scripts/3_generate.sh --config stgcnpp_image
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, stgcnpp.yml, preprocess_stgcnpp.txt, ...

generator: StgcnppImageGenerator
config_save_dir: /root/configs/generator/stgcnpp_image
pgie:
  interval: 0
  model_dir: /root/models/trt/peoplenet
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 0
  model_dir: /root/models/trt/rtmpose-s-aic
stgcnpp:
  interval: 0
  model_dir: /root/models/trt/stgcnpp-ntu60
analyzer: null
input: /root/attachments/images/video1.png
output: /root/outputs/deepstream/stgcnpp_image.jpg
