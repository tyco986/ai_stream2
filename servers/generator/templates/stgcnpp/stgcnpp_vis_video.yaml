# bash servers/generator/scripts/3_generate.sh --config stgcnpp_vis_video
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, stgcnpp.yml, preprocess_stgcnpp.txt, ...

generator: StgcnppVisVideoGenerator
config_save_dir: /root/configs/generator/stgcnpp_vis_video
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 50
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
stgcnpp:
  interval: 50
  model_dir: /root/models/trt/stgcnpp-ntu60
tracker:
  class_id: 0
analyzer: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/stgcnpp_vis_video.mp4
