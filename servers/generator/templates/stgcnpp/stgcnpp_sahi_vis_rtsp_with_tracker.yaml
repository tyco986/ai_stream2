# bash servers/generator/scripts/3_generate.sh --config stgcnpp_sahi_vis_rtsp_with_tracker

generator: StgcnppSahiVisRTSPGenerator
config_save_dir: /root/configs/generator/stgcnpp_sahi_vis_rtsp_with_tracker
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.4
sgie:
  interval: 50
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
stgcnpp:
  interval: 50
  model_dir: /root/models/trt/stgcnpp-ntu60
tracker:
  class_id: 0
analyzer: null
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
