# bash servers/generator/scripts/3_generate.sh --config stgcnpp_vis_rtsp

generator: StgcnppVisRTSPGenerator
config_save_dir: /root/configs/generator/stgcnpp_vis_rtsp
pgie:
  interval: 50
  model_dir: /root/models/trt/peoplenet
  class_attrs:
    0:
      conf: 0.4
sgie:
  interval: 0
  model_dir: /root/models/trt/rtmpose-s-aic
stgcnpp:
  interval: 0
  model_dir: /root/models/trt/stgcnpp-ntu60
tracker:
  class_id: 0
analyzer: null
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
