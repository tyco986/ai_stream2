# bash servers/generator/scripts/3_generate.sh --config stgcnpp_sahi_vis_video
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, stgcnpp.yml, preprocess_stgcnpp.txt, sahi_slice_*.jpg/json, ...
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: StgcnppSahiVisVideoGenerator
config_save_dir: /root/configs/generator/stgcnpp_sahi_vis_video
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 50
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
stgcnpp:
  interval: 50
  model_dir: /root/models/trt/stgcnpp-ntu60
tracker: null
analyzer: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/stgcnpp_sahi_vis_video.mp4
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
