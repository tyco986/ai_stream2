# bash servers/generator/scripts/3_generate.sh --config yolo26n_det_sahi_rtsp

generator: DetSahiVisRTSPGenerator
config_save_dir: /root/configs/generator/yolo26n_det_sahi_rtsp
interval: 0
pgie:
  model_dir: /root/models/trt/yolo26n-sahi
  class_attr:
    all:
      conf: 0.25
enable_visualized_rtsp: true
tracker: null
analyzer: null
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 30
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 30
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess:
    match_threshold: 0.5
