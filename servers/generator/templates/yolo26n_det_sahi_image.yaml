# bash servers/generator/scripts/3_generate.sh --config <template_name>
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: YoloDetSahiImageConfigGenerator
config_save_dir: /root/configs/generator/yolo26n_det_sahi_image
pgie_model_dir: models/trt/yolo26n-sahi
input: /root/attachments/images/test.png
output: /root/outputs/deepstream/yolo26n_det_sahi_image.png
enable_kafka: false
pgie_class_attr:
  all:
    conf: 0.25
sahi_config:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess:
    match_threshold: 0.5
