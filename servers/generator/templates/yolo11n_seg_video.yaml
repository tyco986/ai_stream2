# bash servers/generator/scripts/3_generate.sh --config yolo11n_seg_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: SegVideoGenerator
config_save_dir: /root/configs/generator/yolo11n_seg_video
interval: 0
pgie:
  model_dir: /root/models/trt/yolo11n-seg
  class_attr:
    all:
      conf: 0.25
tracker:
  class_id: -1
analyzer: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/yolo11n_seg_video.mp4
