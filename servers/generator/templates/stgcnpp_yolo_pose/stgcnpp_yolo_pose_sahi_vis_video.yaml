# bash servers/generator/scripts/3_generate.sh --config stgcnpp_yolo_pose_sahi_vis_video
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, stgcnpp.yml, preprocess_stgcnpp.txt, sahi_slice_*.jpg/json, ...
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: StgcnppYoloPoseSahiVisVideoGenerator
pipeline_name: stgcnpp_yolo_pose_sahi_vis_video
pgie:
  interval: 1
  model_zip: /root/history/export_trt/yolo26n-pose.zip
  class_attrs:
    all:
      conf: 0.25
stgcnpp:
  interval: 1
  model_zip: /root/history/export_trt/stgcnpp-ntu60-j.zip
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
  mode: coco17
videos:
  - /root/attachments/videos/video1.mp4
  - /root/attachments/videos/video2.mp4
output: /root/outputs/deepstream/stgcnpp_yolo_pose_sahi_vis_video
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocesspose:
    oks_threshold: 0.5
