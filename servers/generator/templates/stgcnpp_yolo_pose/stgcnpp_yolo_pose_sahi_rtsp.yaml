# bash servers/generator/scripts/3_generate.sh --config stgcnpp_yolo_pose_sahi_rtsp

generator: StgcnppYoloPoseSahiRTSPGenerator
pipeline_name: stgcnpp_yolo_pose_sahi_rtsp
pgie:
  interval: 1
  model_zip: /root/history/export_trt/yolo26n-pose.zip
  class_attrs:
    all:
      conf: 0.4
stgcnpp:
  interval: 1
  model_zip: /root/history/export_trt/stgcnpp-ntu60-j.zip
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer: null
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
sahi:
  preprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  postprocess:
    class_agnostic: false
    match_metric: 1
    match_threshold: 0.5
    prefer_full_frame: true
    max_detections: -1
    oks_threshold: 0.5
    vis_threshold: 0.0
    num_keypoints: 0
