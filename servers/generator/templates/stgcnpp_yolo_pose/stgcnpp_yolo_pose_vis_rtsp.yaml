# bash servers/generator/scripts/3_generate.sh --config stgcnpp_yolo_pose_vis_rtsp

generator: StgcnppYoloPoseVisRTSPGenerator
pipeline_name: stgcnpp_yolo_pose_vis_rtsp
config_save_dir: /root/configs/generator/stgcnpp_yolo_pose_vis_rtsp
pgie:
  interval: 0
  model_dir: /root/models/trt/yolo26n-pose
  class_attrs:
    all:
      conf: 0.4
stgcnpp:
  interval: 50
  model_dir: /root/models/trt/stgcnpp-ntu60
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.0
  mode: coco17
event_coder: null
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
