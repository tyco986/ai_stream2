# bash servers/generator/scripts/3_generate.sh --config stgcnpp_yolo_pose_vis_rtsp

generator: StgcnppYoloPoseVisRTSPGenerator
pipeline_name: stgcnpp_yolo_pose_vis_rtsp
pgie:
  interval: 1
  model_zip: /root/history/export_trt/yolo26n-pose.zip
  class_attrs:
    all:
      conf: 0.4
stgcnpp:
  interval: 1
  model_zip: /root/history/export_trt/stgcnpp-ntu60-j.zip
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
