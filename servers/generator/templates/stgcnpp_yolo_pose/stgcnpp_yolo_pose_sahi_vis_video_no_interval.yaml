# bash servers/generator/scripts/3_generate.sh --config stgcnpp_yolo_pose_sahi_vis_video_no_interval
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, stgcnpp.yml, preprocess_stgcnpp.txt, sahi_slice_*.jpg/json, ...
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: StgcnppYoloPoseSahiVisVideoGenerator
pipeline_name: stgcnpp_yolo_pose_sahi_vis_video_no_interval
config_save_dir: /root/configs/generator/stgcnpp_yolo_pose_sahi_vis_video_no_interval
pgie:
  interval: 0
  model_dir: /root/models/trt/yolo26n-pose
  class_attrs:
    all:
      conf: 0.25
stgcnpp:
  interval: 50
  model_dir: /root/models/trt/stgcnpp-ntu60
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer:
  interval: 1
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.0
  mode: coco17
event_coder: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/stgcnpp_yolo_pose_sahi_vis_video_no_interval.mp4
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess_pose:
    oks_threshold: 0.5
