# bash servers/generator/scripts/3_generate.sh --config stgcnpp_yolo_pose_video
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, stgcnpp.yml, preprocess_stgcnpp.txt, ...

generator: StgcnppYoloPoseVideoGenerator
pipeline_name: stgcnpp_yolo_pose_video
pgie:
  interval: 1
  model_zip: /root/history/export_trt/yolo26n-pose.zip
  class_attrs:
    all:
      conf: 0.25
stgcnpp:
  interval: 1
  model_zip: /root/history/export_trt/stgcnpp-ntu60-j.zip
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer: null
videos:
  - /root/attachments/videos/video1.mp4
  - /root/attachments/videos/video2.mp4
