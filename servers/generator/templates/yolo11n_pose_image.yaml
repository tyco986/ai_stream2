# bash servers/generator/scripts/3_generate.sh --config yolo11n_pose_image
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: PoseImageGenerator
config_save_dir: /root/configs/generator/yolo11n_pose_image
interval: 0
pgie:
  model_dir: /root/models/trt/yolo11n-pose
  class_attr:
    all:
      conf: 0.25
analyzer: null
input: /root/attachments/images/test.png
output: /root/outputs/deepstream/yolo11n_pose_image.jpg
