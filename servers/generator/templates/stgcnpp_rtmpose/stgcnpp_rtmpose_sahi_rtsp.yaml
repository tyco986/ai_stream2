# bash servers/generator/scripts/3_generate.sh --config stgcnpp_rtmpose_sahi_rtsp

generator: StgcnppRtmposeSahiRTSPGenerator
pipeline_name: stgcnpp_rtmpose_sahi_rtsp
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n.zip
  class_attrs:
    0:
      conf: 0.4
sgie:
  interval: 1
  model_zip: /root/history/export_trt/rtmpose-t-body8.zip
stgcnpp:
  interval: 1
  model_zip: /root/history/export_trt/stgcnpp-ntu60-j.zip
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer: null
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
