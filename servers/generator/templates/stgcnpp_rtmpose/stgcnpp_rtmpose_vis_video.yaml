# bash servers/generator/scripts/3_generate.sh --config stgcnpp_rtmpose_vis_video
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, stgcnpp.yml, preprocess_stgcnpp.txt, ...

generator: StgcnppRtmposeVisVideoGenerator
pipeline_name: stgcnpp_rtmpose_vis_video
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n.zip
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 1
  model_zip: /root/history/export_trt/rtmpose-t-body8.zip
stgcnpp:
  interval: 1
  model_zip: /root/history/export_trt/stgcnpp-ntu60-j.zip
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
videos:
  - /root/attachments/videos/video1.mp4
  - /root/attachments/videos/video2.mp4
output: /root/outputs/deepstream/stgcnpp_rtmpose_vis_video
