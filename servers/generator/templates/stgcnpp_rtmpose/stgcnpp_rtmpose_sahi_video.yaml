# bash servers/generator/scripts/3_generate.sh --config stgcnpp_rtmpose_sahi_video
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, stgcnpp.yml, preprocess_stgcnpp.txt, sahi_slice_*.jpg/json, ...
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: StgcnppRtmposeSahiVideoGenerator
pipeline_name: stgcnpp_rtmpose_sahi_video
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n.zip
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 1
  model_zip: /root/history/export_trt/rtmpose-t-body8.zip
stgcnpp:
  interval: 1
  model_zip: /root/history/export_trt/stgcnpp-ntu60-j.zip
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 1
drawer: null
videos:
  - /root/attachments/videos/video1.mp4
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
