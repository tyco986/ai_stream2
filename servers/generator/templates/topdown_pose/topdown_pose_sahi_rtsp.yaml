# bash servers/generator/scripts/3_generate.sh --config topdown_pose_sahi_rtsp

generator: TopdownPoseSahiRTSPGenerator
config_save_dir: /root/configs/generator/topdown_pose_sahi_rtsp
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 50
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
tracker: null
analyzer: null
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
