# bash servers/generator/scripts/3_generate.sh --config topdown_pose_sahi_vis_video_with_tracker
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.
# Reference frame: attachments/images/video1.png (1920x1080), main flow is vertical.

generator: TopdownPoseSahiVisVideoGenerator
pipeline_name: topdown_pose_sahi_vis_video_with_tracker
config_save_dir: /root/configs/generator/topdown_pose_sahi_vis_video_with_tracker
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 50
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.0
  mode: coco17
event_coder: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/topdown_pose_sahi_vis_video_with_tracker.mp4
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
