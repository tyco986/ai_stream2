# bash servers/generator/scripts/3_generate.sh --config topdown_pose_sahi_image
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: TopdownPoseSahiImageGenerator
config_save_dir: /root/configs/generator/topdown_pose_sahi_image
pgie:
  interval: 0
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 0
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
analyzer: null
input: /root/attachments/images/video1.png
output: /root/outputs/deepstream/topdown_pose_sahi_image.jpg
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
