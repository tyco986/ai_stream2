# bash servers/generator/scripts/3_generate.sh --config topdown_pose_sahi_image
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, params.yml, sahi_slice_*.jpg/json, ... under config_save_dir.
# runtime batch size = SAHI tile count; mux batch size = 1.

generator: TopdownPoseSahiImageGenerator
pipeline_name: topdown_pose_sahi_image
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n.zip
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 50
  model_zip: /root/history/export_trt/rtmpose-t-body8.zip
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
images:
  - /root/attachments/images/video1.png
  - /root/attachments/images/video2.png
output: /root/outputs/deepstream/topdown_pose_sahi_image
sahi:
  preprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  postprocess:
    match_metric: 1
    match_threshold: 0.5
    class_agnostic: false
    enable_merge: true
    two_phase_nmm: true
    prefer_full_frame: true
