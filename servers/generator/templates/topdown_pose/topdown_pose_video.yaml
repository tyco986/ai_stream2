# bash servers/generator/scripts/3_generate.sh --config topdown_pose_video
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, params.yml, ... under config_save_dir.
# Reference frame: attachments/images/video1.png (1920x1080), main flow is vertical.

generator: TopdownPoseVideoGenerator
pipeline_name: topdown_pose_video
config_save_dir: /root/configs/generator/topdown_pose_video
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 50
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
tracker: null
analyzer: null
logger:
  interval: 50
drawer: null
event_coder: null
input: /root/attachments/videos/video1.mp4
