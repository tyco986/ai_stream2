# bash servers/generator/scripts/3_generate.sh --config topdown_pose_vis_rtsp

generator: TopdownPoseVisRTSPGenerator
pipeline_name: topdown_pose_vis_rtsp
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n.zip
  class_attrs:
    0:
      conf: 0.4
sgie:
  interval: 50
  model_zip: /root/history/export_trt/rtmpose-t-body8.zip 
tracker:
  class_id: 0
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
  mode: coco17
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
