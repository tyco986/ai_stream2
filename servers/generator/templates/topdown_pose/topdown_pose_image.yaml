# bash servers/generator/scripts/3_generate.sh --config topdown_pose_image
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, params.yml, ... under config_save_dir.

generator: TopdownPoseImageGenerator
pipeline_name: topdown_pose_image
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n.zip
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 50
  model_zip: /root/history/export_trt/rtmpose-t-body8.zip
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
images:
  - /root/attachments/images/video1.png
  - /root/attachments/images/video2.png
output: /root/outputs/deepstream/topdown_pose_image
