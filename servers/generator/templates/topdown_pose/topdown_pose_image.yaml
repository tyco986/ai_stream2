# bash servers/generator/scripts/3_generate.sh --config topdown_pose_image
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, params.yml, ... under config_save_dir.

generator: TopdownPoseImageGenerator
pipeline_name: topdown_pose_image
config_save_dir: /root/configs/generator/topdown_pose_image
pgie:
  interval: 50
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 50
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.0
  mode: coco17
event_coder: null
input: /root/attachments/images/video1.png
output: /root/outputs/deepstream/topdown_pose_image.jpg
