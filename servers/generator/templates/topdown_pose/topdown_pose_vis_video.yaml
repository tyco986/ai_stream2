# bash servers/generator/scripts/3_generate.sh --config topdown_pose_vis_video
#
# Artifacts: pipeline.yml, pgie.yml, sgie.yml, params.yml, ... under config_save_dir.
# Reference frame: attachments/images/video1.png (1920x1080), main flow is vertical.

generator: TopdownPoseVisVideoGenerator
pipeline_name: topdown_pose_vis_video
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo26n.zip
  class_attrs:
    0:
      conf: 0.25
sgie:
  interval: 50
  model_zip: /root/history/export_trt/rtmpose-t-body8.zip
tracker: null
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.5
videos:
  - path: /root/attachments/videos/video1.mp4
    width: 1920
    height: 1080
    fps: 25
  - path: /root/attachments/videos/video2.mp4
    width: 1920
    height: 1080
    fps: 25
filesink_output: /root/media/pipeline/topdown_pose_vis_video
