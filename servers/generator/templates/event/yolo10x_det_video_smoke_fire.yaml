# bash servers/generator/scripts/3_generate.sh --config yolo10x_smoke_fire_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: DetVideoPresenceGenerator
pipeline_name: yolo10x_smoke_fire_video
config_save_dir: /root/configs/generator/yolo10x_smoke_fire_video
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo10x-fire-smoke.zip
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null 
collector:
  interval: 50
  dump_codes: "12"
  capturer_output: /root/events/yolo10x_smoke_fire_video
drawer:
  interval: 50
  fade_time: 1
  show_label: true
event_coder:
  event_slot_map: "0:0:Fire;1:1:Smoke"
  length: 5
  threshold: 0.5
  mode: fold
capturer:
  label_task: det
videos:
  - path: /root/attachments/videos/video1.mp4
    width: 1920
    height: 1080
    fps: 25
  - path: /root/attachments/videos/video2.mp4
    width: 1920
    height: 1080
    fps: 25
