# bash servers/generator/scripts/3_generate.sh --config yolo10x_smoke_fire_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: DetVideoPresenceGenerator
pipeline_name: yolo10x_smoke_fire_video
config_save_dir: /root/configs/generator/yolo10x_smoke_fire_video
pgie:
  interval: 50
  model_dir: /root/models/trt/yolov10x-smoke-fire
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
logger:
  interval: 50
drawer: null
event_coder:
  class_ids: [0, 1]
  event_names: [Fire, Smoke]
  length: 5
  threshold: 0.5
  mode: fold
capturer:
  capture_codes: "1"
input: /root/attachments/videos/video2.mp4
