# bash servers/generator/scripts/3_generate.sh --config yolo10x_smoke_fire_sahi_rtsp

generator: DetSahiRTSPPresenceGenerator
pipeline_name: yolo10x_smoke_fire_sahi_rtsp
config_save_dir: /root/configs/generator/yolo10x_smoke_fire_sahi_rtsp
pgie:
  interval: 50
  model_dir: /root/models/trt/yolov10x-smoke-fire
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
logger:
  interval: 50
drawer: null
event_coder:
  class_ids: [0, 1]
  event_names: [Fire, Smoke]
  length: 5
  threshold: 0.5
  mode: fold
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess:
    match_threshold: 0.5
