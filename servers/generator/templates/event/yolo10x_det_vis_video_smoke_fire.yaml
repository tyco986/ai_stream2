# bash servers/generator/scripts/3_generate.sh --config yolo10x_smoke_fire_vis_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: DetVisVideoPresenceGenerator
pipeline_name: yolo10x_smoke_fire_vis_video
config_save_dir: /root/configs/generator/yolo10x_smoke_fire_vis_video
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo10x-fire-smoke.zip
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
event_coder:
  event_slot_map: "0:0:Fire;1:1:Smoke"
  length: 5
  threshold: 0.5
  mode: fold
capturer:
  capture_codes: "12"
videos:
  - /root/attachments/videos/video1.mp4
  - /root/attachments/videos/video2.mp4
output: /root/outputs/deepstream/yolo10x_smoke_fire_vis_video
