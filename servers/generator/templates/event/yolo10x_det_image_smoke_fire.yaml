# bash servers/generator/scripts/3_generate.sh --config yolo10x_smoke_fire_image
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: DetImagePresenceGenerator
pipeline_name: yolo10x_smoke_fire_image
config_save_dir: /root/configs/generator/yolo10x_smoke_fire_image
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo10x-fire-smoke.zip
  class_attrs:
    all:
      conf: 0.25
analyzer: null
collector:
  interval: 50
  dump_codes: "12"
  capturer_output: /root/events/yolo10x_smoke_fire_image
drawer:
  interval: 50
  fade_time: 1
  show_label: true
event_coder:
  event_slot_map: "0:0:Fire;1:1:Smoke"
  length: 1
  threshold: 0.5
  mode: fold
capturer:
  label_task: det
images:
  - path: /root/attachments/images/video1.png
    width: 1920
    height: 1080
  - path: /root/attachments/images/video2.png
    width: 1920
    height: 1080
filesink_output: /root/media/pipeline/yolo10x_smoke_fire_image