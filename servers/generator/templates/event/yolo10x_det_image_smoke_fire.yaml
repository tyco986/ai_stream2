# bash servers/generator/scripts/3_generate.sh --config yolo10x_smoke_fire_image
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: DetImagePresenceGenerator
pipeline_name: yolo10x_smoke_fire_image
config_save_dir: /root/configs/generator/yolo10x_smoke_fire_image
pgie:
  interval: 50
  model_zip: /root/history/export_trt/yolo10x-fire-smoke.zip
  class_attrs:
    all:
      conf: 0.25
analyzer: null
logger:
  interval: 50
drawer:
  interval: 50
  fade_time: 1
  show_label: true
event_coder:
  class_event_map: "0:Fire;1:Smoke"
  length: 1
  threshold: 0.5
  mode: fold
capturer:
  capture_codes: "12"
images:
  - /root/attachments/images/video1.png
  - /root/attachments/images/video2.png
output: /root/outputs/deepstream/yolo10x_smoke_fire_image
