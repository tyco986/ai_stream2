# bash servers/generator/scripts/3_generate.sh --config peoplenet_image
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.

generator: DetImageGenerator
config_save_dir: /root/configs/generator/peoplenet_image
interval: 0
pgie:
  model_dir: /root/models/trt/peoplenet
  class_attrs:
    all:
      conf: 0.25
analyzer: null
input: /root/attachments/images/video1.png
output: /root/outputs/deepstream/peoplenet_image.jpg
