# bash servers/generator/scripts/3_generate.sh --config peoplenet_video
#
# Artifacts: pipeline.yml, pgie.yml, params.yml, ... under config_save_dir.
# Reference frame: attachments/images/video1.png (1920x1080), main flow is vertical.

generator: DetVideoGenerator
config_save_dir: /root/configs/generator/peoplenet_video
pgie:
  interval: 50
  model_dir: /root/models/trt/peoplenet
  class_attrs:
    all:
      conf: 0.25
tracker: null
analyzer: null
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/peoplenet_video.mp4
