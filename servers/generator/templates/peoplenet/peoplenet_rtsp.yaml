# bash servers/generator/scripts/3_generate.sh --config peoplenet_rtsp

generator: DetRTSPGenerator
config_save_dir: /root/configs/generator/peoplenet_rtsp
pgie:
  interval: 50
  model_dir: /root/models/trt/peoplenet
  class_attrs:
    all:
      conf: 0.25
tracker:
  class_id: 0
analyzer: null
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
