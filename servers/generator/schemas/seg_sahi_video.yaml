type: SegSahiVideoGenerator
params:
  pipeline_name:
    available: true
    default: null
  streams:
    available: false
    params: {}
  pgie:
    available: true
    params:
      interval:
        available: true
        min: 1
        default: 50
  tracker:
    available: true
    params:
      class_id:
        available: true
        default:
        - -1
  analyzer:
    available: true
    params:
      streams:
        available: true
        default: []
      template:
        available: true
        default: null
      roi_filtering:
        available: true
        default:
          class_id:
          - -1
      overcrowding:
        available: true
        default: null
      line_crossing:
        available: true
        default: null
      direction_detection:
        available: true
        default: null
  logger:
    available: true
    params:
      root:
        available: true
        default: /root/logs/deepstream
      interval:
        available: true
        default: 0
  drawer:
    available: false
    params:
      interval:
        available: false
        default: 50
      fade_time:
        available: false
        default: 1
      show_label:
        available: false
        default: true
      show_mask:
        available: false
        default: true
  event_coder:
    available: false
    params:
      class_ids:
        available: false
        default:
        - 0
        - 1
      event_names:
        available: false
        default:
        - Fire
        - Smoke
      length:
        available: false
        default: 10
      threshold:
        available: false
        default: 0.5
      mode:
        available: false
        default: fold
  sahi:
    available: true
    params:
      nvsahipreprocess:
        available: true
        default:
          slice_width: 640
          slice_height: 640
          overlap_width_ratio: 0.2
          overlap_height_ratio: 0.2
      nvsahipostprocess:
        available: true
        default:
          match_threshold: 0.5
  input:
    available: true
    default: null
  output:
    available: false
    default: null
