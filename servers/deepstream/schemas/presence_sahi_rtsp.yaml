type: PresenceSahiRTSPPipeline
params:
  drawer:
    available: true
    params:
      show_label:
        available: true
        default: true
      show_conf:
        available: true
        default: true
      show_id:
        available: true
        default: false
      interval:
        available: true
        default: 50
      fade_time:
        available: true
        default: 1
  logger:
    available: true
    params:
      interval:
        available: true
        default: 0
  messager:
    available: true
    params:
      interval:
        available: true
        default: 0
  debouncer:
    available: true
    params:
      length:
        available: true
        default: 10
      threshold:
        available: true
        default: 0.5
      class_ids:
        available: true
        default:
        - 0
        - 1
      mode:
        available: true
        default: fold
  capturer:
    available: true
    params:
      output_dir:
        available: true
        default: /root/output
