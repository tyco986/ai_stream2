# MediaMTX for ai_stream2 (external container). Mount as /mediamtx.yml.
# DeepStream sends preview RTP to UDP :5400 (H264 PT 96).
rtspAddress: :8554
webrtcAddress: :8889

paths:
  preview:
    source: udp+rtp://0.0.0.0:5400
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=DeepStream Preview
      c=IN IP4 0.0.0.0
      t=0 0
      m=video 5400 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1

  all_others:
    source: publisher
