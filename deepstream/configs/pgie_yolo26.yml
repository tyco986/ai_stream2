# Primary GIE — YOLO26n (Ultralytics ONNX + DeepStream-Yolo custom parser)
# See: https://github.com/marcoslucianops/DeepStream-Yolo/blob/master/docs/YOLO26.md

property:
  gpu-id: 0
  onnx-file: /app/models/onnx/yolo26n/yolo26n.onnx
  model-engine-file: /app/models/onnx/yolo26n/yolo26n.onnx_b16_gpu0_fp16.engine
  labelfile-path: /app/configs/labels.txt
  batch-size: 16
  network-mode: 2
  process-mode: 1
  model-color-format: 0
  num-detected-classes: 80
  gie-unique-id: 1
  interval: 0
  cluster-mode: 4
  maintain-aspect-ratio: 1
  symmetric-padding: 1
  net-scale-factor: 0.00392156862745098
  infer-dims: 3;640;640
  custom-lib-path: /app/libs/libnvdsinfer_custom_impl_Yolo.so
  parse-bbox-func-name: NvDsInferParseYolo

class-attrs-all:
  pre-cluster-threshold: 0.25
