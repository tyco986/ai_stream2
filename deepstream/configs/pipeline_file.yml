# Local video file -> MP4 with OSD (native resolution).
# Run: python main.py -c configs/pipeline_file.yml
# Place input under input/ (container: /app/input/). Output: output/

app:
  pgie-config: configs/pgie_yolo26_person_native.yml
  source-uri: file:///app/input/input.mp4
  output-path: output/input_ds.mp4
  live-source: 0

pipeline:
  name: yolo26-file-detection

  elements:
    - name: src0
      type: nvurisrcbin
      properties:
        uri: ${source-uri}
        disable-audio: 1

    - name: mux
      type: nvstreammux
      properties:
        batch-size: 1
        width: 0
        height: 0
        enable-padding: 0
        batched-push-timeout: 40000
        gpu-id: 0
        live-source: ${live-source}

    - name: pgie
      type: nvinfer
      properties:
        config-file-path: ${pgie-config}

    - name: osd
      type: nvosdbin
      properties:
        gpu-id: 0

    - name: nvvidconv
      type: nvvideoconvert
      properties:
        gpu-id: 0

    - name: encoder
      type: nvv4l2h264enc
      properties:
        bitrate: 4000000
        iframeinterval: 30
        preset-id: 1
        gpu-id: 0

    - name: h264parse
      type: h264parse

    - name: mp4mux
      type: mp4mux

    - name: sink
      type: filesink
      properties:
        location: ${output-path}
        sync: 0
        async: 0

  links:
    - [[src0, mux], ["", "sink_%u"]]
    - [mux, pgie, osd, nvvidconv, encoder, h264parse, mp4mux, sink]
