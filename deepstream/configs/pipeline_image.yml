# Single image (nvurisrcbin + file://) -> JPG with OSD (native resolution).
# Run: python main.py -c configs/pipeline_image.yml
# Place input under input/ (container: /app/input/). Output: output/

app:
  pgie-config: configs/pgie_yolo26_person_native.yml
  source-uri: file:///app/input/input.jpg
  output-path: output/input_ds.jpg
  live-source: 0

pipeline:
  name: yolo26-image-detection

  elements:
    - name: src0
      type: nvurisrcbin
      properties:
        uri: ${source-uri}
        disable-audio: 1
        num-buffers: 1

    - name: mux
      type: nvstreammux
      properties:
        batch-size: 1
        width: 0
        height: 0
        enable-padding: 0
        batched-push-timeout: 40000
        gpu-id: 0
        live-source: ${live-source}

    - name: pgie
      type: nvinfer
      properties:
        config-file-path: ${pgie-config}

    - name: osd
      type: nvosdbin
      properties:
        gpu-id: 0

    - name: nvvidconv
      type: nvvideoconvert
      properties:
        gpu-id: 0

    - name: caps_i420
      type: capsfilter
      properties:
        caps: video/x-raw, format=I420

    - name: jpegenc
      type: jpegenc
      properties:
        quality: 90

    - name: sink
      type: filesink
      properties:
        location: ${output-path}
        sync: 0
        async: 0

  links:
    - [[src0, mux], ["", "sink_%u"]]
    - [mux, pgie, osd, nvvidconv, caps_i420, jpegenc, sink]
