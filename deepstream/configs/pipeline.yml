# Pipeline: python main.py -c configs/pipeline.yml
# Native pyservicemaker schema: deepstream/nodes/edges
# Input: rtsp://ai_stream2_mediamtx:8554/video1
# Output: rtsp://ai_stream2_mediamtx:8554/video1_ds

deepstream:
  nodes:
    - name: src0
      type: nvurisrcbin
      properties:
        uri: rtsp://ai_stream2_mediamtx:8554/video1
        disable-audio: true

    - name: mux
      type: nvstreammux
      properties:
        batch-size: 1
        width: 1920
        height: 1080
        enable-padding: false
        batched-push-timeout: 40000
        gpu-id: 0
        live-source: true

    - name: pgie
      type: nvinfer
      properties:
        config-file-path: configs/pgie_yolo11_person_native.yml

    - name: osd
      type: nvosdbin
      properties:
        gpu-id: 0

    - name: nvvidconv
      type: nvvideoconvert
      properties:
        gpu-id: 0

    - name: encoder
      type: nvv4l2h264enc
      properties:
        bitrate: 4000000
        iframeinterval: 25
        preset-id: 1
        gpu-id: 0

    - name: h264parse
      type: h264parse

    - name: sink
      type: rtspclientsink
      properties:
        location: rtsp://ai_stream2_mediamtx:8554/video1_ds
        sync: false
        async: false

  edges:
    src0: mux
    mux: pgie
    pgie: osd
    osd: nvvidconv
    nvvidconv: encoder
    encoder: h264parse
    h264parse: sink
