deepstream:
  nodes:
  - type: nvurisrcbin
    name: src0
    properties:
      uri: rtsp://ai_stream2_mediamtx:8554/video1
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: mux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: true
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo11n_pose_rtsp/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvtracker
    name: tracker
    properties:
      ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
      ll-config-file: /root/configs/generator/yolo11n_pose_rtsp/nvtracker.yml
      tracker-width: 1920
      tracker-height: 1056
      gpu-id: 0
  - type: nvstreamdemux
    name: demux
  - type: queue
    name: queue_demux0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvidconv0
    properties:
      gpu-id: 0
  - type: tee
    name: tee_raw0
  - type: queue
    name: queue_raw0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: appsink
    name: appsink_raw0
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
  - type: nvosdbin
    name: osd0
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: tee
    name: tee_vis0
  - type: queue
    name: queue_vis0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: appsink
    name: appsink_vis0
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
  - type: nvv4l2h264enc
    name: encoder0
    properties:
      bitrate: 4000000
      iframeinterval: 30
      preset-id: 1
      gpu-id: 0
  - type: h264parse
    name: h264parse0
  - type: rtspclientsink
    name: sink0
    properties:
      location: rtsp://ai_stream2_mediamtx:8554/video1_ds
      sync: false
      async: false
  edges:
    src0: mux
    mux: pgie
    pgie: tracker
    tracker: demux
    queue_demux0: nvvidconv0
    nvvidconv0: tee_raw0
    tee_raw0:
    - queue_raw0
    - osd0
    queue_raw0: appsink_raw0
    osd0: tee_vis0
    tee_vis0:
    - queue_vis0
    - encoder0
    queue_vis0: appsink_vis0
    encoder0: h264parse0
    h264parse0: sink0
