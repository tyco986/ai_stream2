deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin
    properties:
      uri: file:///root/attachments/images/video1.png
      disable-audio: true
      select-rtp-protocol: 4
      num-buffers: 1
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvsahipreprocess
    name: nvsahipreprocess
    properties:
      config-file: /root/configs/generator/yolo26n_seg_sahi_image/nvsahipreprocess.ini
      slice-width: 640
      slice-height: 640
      overlap-width-ratio: 0.2
      overlap-height-ratio: 0.2
      enable-full-frame: true
      gpu-id: 0
      unique-id: 15
      target-unique-ids: '1'
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo26n_seg_sahi_image/pgie.yml
      batch-size: 9
      gpu-id: 0
      input-tensor-meta: true
      clip-object-outside-roi: false
  - type: queue
    name: queue_sahi
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvsahipostprocess
    name: nvsahipostprocess
    properties:
      gie-ids: '1'
      match-metric: 1
      match-threshold: 0.5
      class-agnostic: false
      enable-merge: true
      two-phase-nmm: true
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/yolo26n_seg_sahi_image/nvdsanalytics.yml
      gpu-id: 0
  - type: tee
    name: tee_msg
  - type: queue
    name: queue_msg
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvmsgconv
    name: nvmsgconv
    properties:
      config: /root/configs/generator/yolo26n_seg_sahi_image/nvmsgconv.yml
      payload-type: 1
      msg2p-newapi: true
      frame-interval: 1
  - type: nvmsgbroker
    name: nvmsgbroker
    properties:
      proto-lib: /opt/nvidia/deepstream/deepstream/lib/libnvds_kafka_proto.so
      conn-str: ai_stream2_kafka;9092
      topic: ai_stream2_yolo26n_seg_sahi_image
      config: /root/configs/generator/yolo26n_seg_sahi_image/kafka.txt
      sync: false
      async: false
  - type: nvsegfadedrawer
    name: nvsegfadedrawer
    properties:
      interval: 50
      fade-time: 1
      show-label: true
      show-mask: true
  - type: nvosdbin
    name: nvosdbin
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: true
  - type: nvvideoconvert
    name: nvvideoconvert
    properties:
      gpu-id: 0
  - type: nvdetlogger
    name: nvdetlogger
    properties:
      root: /root/logs/deepstream/yolo26n_seg_sahi_image
      interval: 50
  - type: nvjpegenc
    name: nvjpegenc
    properties:
      quality: 85
  - type: filesink
    name: filesink
    properties:
      location: /root/outputs/deepstream/yolo26n_seg_sahi_image.jpg
      sync: false
      async: false
  edges:
    nvurisrcbin: nvstreammux
    nvstreammux: nvsahipreprocess
    nvsahipreprocess: pgie
    pgie: queue_sahi
    queue_sahi: nvsahipostprocess
    nvsahipostprocess: nvdsanalytics
    nvdsanalytics: tee_msg
    tee_msg:
    - nvsegfadedrawer
    - queue_msg
    nvsegfadedrawer: nvosdbin
    queue_msg: nvmsgconv
    nvmsgconv: nvmsgbroker
    nvosdbin: nvvideoconvert
    nvvideoconvert: nvdetlogger
    nvdetlogger: nvjpegenc
    nvjpegenc: filesink
