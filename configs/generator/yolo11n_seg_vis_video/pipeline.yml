deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin
    properties:
      uri: file:///root/attachments/videos/video1.mp4
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo11n_seg_vis_video/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/yolo11n_seg_vis_video/nvdsanalytics.yml
      gpu-id: 0
  - type: tee
    name: tee_msg
  - type: queue
    name: queue_msg
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvmsgconv
    name: nvmsgconv
    properties:
      config: /root/configs/generator/yolo11n_seg_vis_video/nvmsgconv.yml
      payload-type: 1
      msg2p-newapi: true
      frame-interval: 1
  - type: nvmsgbroker
    name: nvmsgbroker
    properties:
      proto-lib: /opt/nvidia/deepstream/deepstream/lib/libnvds_kafka_proto.so
      conn-str: ai_stream2_kafka;9092
      topic: ai_stream2_yolo11n_seg_vis_video
      config: /root/configs/generator/yolo11n_seg_vis_video/kafka.txt
      sync: false
      async: false
  - type: nvsegfadedrawer
    name: nvsegfadedrawer
    properties:
      interval: 50
      fade-time: 1
      show-label: true
      show-mask: true
  - type: nvosdbin
    name: nvosdbin
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: true
  - type: nvvideoconvert
    name: nvvideoconvert
    properties:
      gpu-id: 0
  - type: nvdetlogger
    name: nvdetlogger
    properties:
      root: /root/logs/deepstream/yolo11n_seg_vis_video
      interval: 50
  - type: nvv4l2h264enc
    name: nvv4l2h264enc
    properties:
      bitrate: 4000000
      iframeinterval: 25
      preset-id: 1
      gpu-id: 0
  - type: h264parse
    name: h264parse
  - type: mp4mux
    name: mp4mux
  - type: filesink
    name: filesink
    properties:
      location: /root/outputs/deepstream/yolo11n_seg_vis_video.mp4
      sync: false
      async: false
  edges:
    nvurisrcbin: nvstreammux
    nvstreammux: pgie
    pgie: nvdsanalytics
    nvdsanalytics: tee_msg
    tee_msg:
    - nvsegfadedrawer
    - queue_msg
    nvsegfadedrawer: nvosdbin
    queue_msg: nvmsgconv
    nvmsgconv: nvmsgbroker
    nvosdbin: nvvideoconvert
    nvvideoconvert: nvdetlogger
    nvdetlogger: nvv4l2h264enc
    nvv4l2h264enc: h264parse
    h264parse: mp4mux
    mp4mux: filesink
