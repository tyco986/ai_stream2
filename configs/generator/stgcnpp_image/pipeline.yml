deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin
    properties:
      uri: file:///root/attachments/images/video1.png
      disable-audio: true
      select-rtp-protocol: 4
      num-buffers: 1
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/stgcnpp_image/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvinfer
    name: sgie0
    properties:
      config-file-path: /root/configs/generator/stgcnpp_image/sgie0.yml
      batch-size: 64
      gpu-id: 0
  - type: nvdspreprocess
    name: nvdspreprocess
    properties:
      config-file: /root/configs/generator/stgcnpp_image/preprocess_stgcnpp.txt
  - type: nvinfer
    name: sgie1
    properties:
      config-file-path: /root/configs/generator/stgcnpp_image/sgie1.yml
      batch-size: 64
      gpu-id: 0
      input-tensor-meta: true
      clip-object-outside-roi: false
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/stgcnpp_image/nvdsanalytics.yml
      gpu-id: 0
  - type: nvosdbin
    name: nvosdbin
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: nvvideoconvert
    name: nvvideoconvert
    properties:
      gpu-id: 0
  - type: nvjpegenc
    name: nvjpegenc
    properties:
      quality: 85
  - type: filesink
    name: filesink
    properties:
      location: /root/outputs/deepstream/stgcnpp_image.jpg
      sync: false
      async: false
  edges:
    nvurisrcbin: nvstreammux
    nvstreammux: pgie
    pgie: sgie0
    sgie0: nvdspreprocess
    nvdspreprocess: sgie1
    sgie1: nvdsanalytics
    nvdsanalytics: nvosdbin
    nvosdbin: nvvideoconvert
    nvvideoconvert: nvjpegenc
    nvjpegenc: filesink
