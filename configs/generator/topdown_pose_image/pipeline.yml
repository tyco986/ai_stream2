deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin
    properties:
      uri: file:///root/attachments/images/video1.png
      disable-audio: true
      select-rtp-protocol: 4
      num-buffers: 1
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/topdown_pose_image/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvdspreprocess
    name: nvdspreprocess_rtmpose
    properties:
      config-file: /root/configs/generator/topdown_pose_image/nvdspreprocess_rtmpose.txt
  - type: nvinfer
    name: sgie0
    properties:
      config-file-path: /root/configs/generator/topdown_pose_image/sgie0.yml
      batch-size: 64
      gpu-id: 0
      input-tensor-meta: true
      clip-object-outside-roi: false
  - type: nvrtmposepostprocess
    name: nvrtmposepostprocess
    properties:
      sgie-unique-id: 2
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/topdown_pose_image/nvdsanalytics.yml
      gpu-id: 0
  - type: tee
    name: tee_msg
    properties: {}
  - type: queue
    name: queue_msg
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvmsgconv
    name: nvmsgconv
    properties:
      config: /root/configs/generator/topdown_pose_image/nvmsgconv.yml
      payload-type: 1
      msg2p-newapi: true
      frame-interval: 1
  - type: nvmsgbroker
    name: nvmsgbroker
    properties:
      proto-lib: /opt/nvidia/deepstream/deepstream/lib/libnvds_kafka_proto.so
      conn-str: ai_stream2_kafka;9092
      topic: ai_stream2_topdown_pose_image
      config: /root/configs/generator/topdown_pose_image/kafka.txt
      sync: false
      async: false
  - type: nvposefadedrawer
    name: nvposefadedrawer
    properties:
      interval: 50
      fade-time: 1
      show-label: true
      show-pose: true
      pose-threshold: 0.5
      mode: coco17
  - type: nvosdbin
    name: nvosdbin
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: nvvideoconvert
    name: nvvideoconvert
    properties:
      gpu-id: 0
  - type: nvdetlogger
    name: nvdetlogger
    properties:
      root: /root/logs/deepstream/topdown_pose_image
      interval: 50
  - type: nvjpegenc
    name: nvjpegenc
    properties:
      quality: 85
  - type: filesink
    name: filesink
    properties:
      location: /root/outputs/deepstream/topdown_pose_image.jpg
      sync: false
      async: false
  edges:
    nvurisrcbin: nvstreammux
    nvstreammux: pgie
    pgie: nvdspreprocess_rtmpose
    nvdspreprocess_rtmpose: sgie0
    sgie0: nvrtmposepostprocess
    nvrtmposepostprocess: nvdsanalytics
    nvdsanalytics: tee_msg
    tee_msg:
    - nvposefadedrawer
    - queue_msg
    queue_msg: nvmsgconv
    nvmsgconv: nvmsgbroker
    nvposefadedrawer: nvosdbin
    nvosdbin: nvvideoconvert
    nvvideoconvert: nvdetlogger
    nvdetlogger: nvjpegenc
    nvjpegenc: filesink
