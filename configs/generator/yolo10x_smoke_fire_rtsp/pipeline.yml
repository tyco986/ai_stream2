deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin0
    properties:
      uri: rtsp://ai_stream2_mediamtx:8554/video1
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvurisrcbin
    name: nvurisrcbin1
    properties:
      uri: rtsp://ai_stream2_mediamtx:8554/video2
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 2
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: true
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo10x_smoke_fire_rtsp/pgie.yml
      batch-size: 2
      gpu-id: 0
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/yolo10x_smoke_fire_rtsp/nvdsanalytics.yml
      gpu-id: 0
  - type: nvpresencecoder
    name: nvpresencecoder
    properties:
      class-ids: 0;1
      event-names: Fire;Smoke
      length: 5
      threshold: 0.5
      mode: fold
  - type: tee
    name: tee_msg
  - type: queue
    name: queue_msg
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvmsgconv
    name: nvmsgconv
    properties:
      config: /root/configs/generator/yolo10x_smoke_fire_rtsp/nvmsgconv.yml
      payload-type: 1
      msg2p-newapi: true
      frame-interval: 1
  - type: nvmsgbroker
    name: nvmsgbroker
    properties:
      proto-lib: /opt/nvidia/deepstream/deepstream/lib/libnvds_kafka_proto.so
      conn-str: ai_stream2_kafka;9092
      topic: ai_stream2_yolo10x_smoke_fire_rtsp
      config: /root/configs/generator/yolo10x_smoke_fire_rtsp/kafka.txt
      sync: false
      async: false
  - type: nvstreamdemux
    name: nvstreamdemux
  - type: queue
    name: queue_demux0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert0
    properties:
      gpu-id: 0
  - type: tee
    name: tee_raw0
  - type: queue
    name: queue_raw0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_raw0
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_raw0
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: nvrawcapturer
    name: nvrawcapturer0
    properties:
      output-dir: /root/outputs/deepstream/yolo10x_smoke_fire_rtsp
      capture-codes: '1'
  - type: fakesink
    name: fakesink_raw0
    properties:
      sync: false
      async: false
  - type: queue
    name: queue_osd0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_osd0
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_osd0
    properties:
      caps: video/x-raw(memory:NVMM), format=RGBA
  - type: nvosdbin
    name: nvosdbin0
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: nvpresencelogger
    name: nvpresencelogger0
    properties:
      root: /root/logs/deepstream/yolo10x_smoke_fire_rtsp
      interval: 50
  - type: queue
    name: queue_vis0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_vis0
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_vis0
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: nvviscapturer
    name: nvviscapturer0
    properties:
      output-dir: /root/outputs/deepstream/yolo10x_smoke_fire_rtsp
      capture-codes: '1'
      label-task: det
  - type: fakesink
    name: fakesink_vis0
    properties:
      sync: false
      async: false
  - type: queue
    name: queue_demux1
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert1
    properties:
      gpu-id: 0
  - type: tee
    name: tee_raw1
  - type: queue
    name: queue_raw1
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_raw1
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_raw1
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: nvrawcapturer
    name: nvrawcapturer1
    properties:
      output-dir: /root/outputs/deepstream/yolo10x_smoke_fire_rtsp
      capture-codes: '1'
  - type: fakesink
    name: fakesink_raw1
    properties:
      sync: false
      async: false
  - type: queue
    name: queue_osd1
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_osd1
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_osd1
    properties:
      caps: video/x-raw(memory:NVMM), format=RGBA
  - type: nvosdbin
    name: nvosdbin1
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: nvpresencelogger
    name: nvpresencelogger1
    properties:
      root: /root/logs/deepstream/yolo10x_smoke_fire_rtsp
      interval: 50
  - type: queue
    name: queue_vis1
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_vis1
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_vis1
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: nvviscapturer
    name: nvviscapturer1
    properties:
      output-dir: /root/outputs/deepstream/yolo10x_smoke_fire_rtsp
      capture-codes: '1'
      label-task: det
  - type: fakesink
    name: fakesink_vis1
    properties:
      sync: false
      async: false
  edges:
    nvurisrcbin0: nvstreammux
    nvurisrcbin1: nvstreammux
    nvstreammux: pgie
    pgie: nvdsanalytics
    nvdsanalytics: nvpresencecoder
    nvpresencecoder: tee_msg
    tee_msg:
    - nvstreamdemux
    - queue_msg
    queue_msg: nvmsgconv
    nvmsgconv: nvmsgbroker
    queue_demux0: nvvideoconvert0
    nvvideoconvert0: tee_raw0
    tee_raw0:
    - queue_raw0
    - queue_osd0
    queue_raw0: nvvideoconvert_raw0
    nvvideoconvert_raw0: capsfilter_raw0
    capsfilter_raw0: nvrawcapturer0
    nvrawcapturer0: fakesink_raw0
    queue_osd0: nvvideoconvert_osd0
    nvvideoconvert_osd0: capsfilter_osd0
    capsfilter_osd0: nvosdbin0
    nvosdbin0: nvpresencelogger0
    nvpresencelogger0: queue_vis0
    queue_vis0: nvvideoconvert_vis0
    nvvideoconvert_vis0: capsfilter_vis0
    capsfilter_vis0: nvviscapturer0
    nvviscapturer0: fakesink_vis0
    queue_demux1: nvvideoconvert1
    nvvideoconvert1: tee_raw1
    tee_raw1:
    - queue_raw1
    - queue_osd1
    queue_raw1: nvvideoconvert_raw1
    nvvideoconvert_raw1: capsfilter_raw1
    capsfilter_raw1: nvrawcapturer1
    nvrawcapturer1: fakesink_raw1
    queue_osd1: nvvideoconvert_osd1
    nvvideoconvert_osd1: capsfilter_osd1
    capsfilter_osd1: nvosdbin1
    nvosdbin1: nvpresencelogger1
    nvpresencelogger1: queue_vis1
    queue_vis1: nvvideoconvert_vis1
    nvvideoconvert_vis1: capsfilter_vis1
    capsfilter_vis1: nvviscapturer1
    nvviscapturer1: fakesink_vis1
