generator: PoseSahiImageGenerator
input: /root/attachments/images/video1.png
output: /root/outputs/deepstream/yolo26n_pose_sahi_image.jpg
pgie:
  model_dir: /root/models/trt/yolo26n-pose
  class_attrs:
    all:
      conf: 0.25
  interval: 50
analyzer: null
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess_pose:
    oks_threshold: 0.5
config_save_dir: /root/configs/generator/yolo26n_pose_sahi_image
