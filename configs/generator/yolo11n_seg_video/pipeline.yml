deepstream:
  nodes:
  - type: nvurisrcbin
    name: src
    properties:
      uri: file:///root/attachments/videos/video1.mp4
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: mux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo11n_seg_video/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvtracker
    name: tracker
    properties:
      ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
      ll-config-file: /root/configs/generator/yolo11n_seg_video/nvtracker.yml
      tracker-width: 1920
      tracker-height: 1056
      gpu-id: 0
      operate-on-class-ids: ''
  - type: nvosdbin
    name: osd
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: true
  - type: nvvideoconvert
    name: nvvidconv
    properties:
      gpu-id: 0
  - type: nvv4l2h264enc
    name: encoder
    properties:
      bitrate: 4000000
      iframeinterval: 25
      preset-id: 1
      gpu-id: 0
  - type: h264parse
    name: h264parse
  - type: mp4mux
    name: mp4mux
  - type: filesink
    name: sink
    properties:
      location: /root/outputs/deepstream/yolo11n_seg_video.mp4
      sync: false
      async: false
  edges:
    src: mux
    mux: pgie
    pgie: tracker
    tracker: osd
    osd: nvvidconv
    nvvidconv: encoder
    encoder: h264parse
    h264parse: mp4mux
    mp4mux: sink
