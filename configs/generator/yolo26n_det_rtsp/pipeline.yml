deepstream:
  nodes:
  - type: nvurisrcbin
    name: src0
    properties:
      uri: rtsp://ai_stream2_mediamtx:8554/video1
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvurisrcbin
    name: src1
    properties:
      uri: rtsp://ai_stream2_mediamtx:8554/video2
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: mux
    properties:
      batch-size: 2
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: true
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo26n_det_rtsp/pgie.yml
      batch-size: 2
      gpu-id: 0
  - type: nvdsanalytics
    name: analyzer
    properties:
      config-file: /root/configs/generator/yolo26n_det_rtsp/nvdsanalytics.yml
      gpu-id: 0
  - type: nvstreamdemux
    name: demux
  - type: queue
    name: queue_demux0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvidconv0
    properties:
      gpu-id: 0
  - type: tee
    name: tee_raw0
  - type: queue
    name: queue_raw0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: appsink
    name: appsink_raw0
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
      async: false
  - type: nvosdbin
    name: osd0
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: tee
    name: tee_vis0
  - type: queue
    name: queue_vis0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: queue
    name: queue_enc0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: appsink
    name: appsink_vis0
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
      async: false
  - type: nvv4l2h264enc
    name: encoder0
    properties:
      bitrate: 4000000
      iframeinterval: 25
      preset-id: 1
      gpu-id: 0
  - type: h264parse
    name: h264parse0
  - type: rtspclientsink
    name: sink0
    properties:
      location: rtsp://ai_stream2_mediamtx:8554/video1_ds
      sync: false
      async: false
  - type: queue
    name: queue_demux1
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvidconv1
    properties:
      gpu-id: 0
  - type: tee
    name: tee_raw1
  - type: queue
    name: queue_raw1
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: appsink
    name: appsink_raw1
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
      async: false
  - type: nvosdbin
    name: osd1
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: tee
    name: tee_vis1
  - type: queue
    name: queue_vis1
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: queue
    name: queue_enc1
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: appsink
    name: appsink_vis1
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
      async: false
  - type: nvv4l2h264enc
    name: encoder1
    properties:
      bitrate: 4000000
      iframeinterval: 25
      preset-id: 1
      gpu-id: 0
  - type: h264parse
    name: h264parse1
  - type: rtspclientsink
    name: sink1
    properties:
      location: rtsp://ai_stream2_mediamtx:8554/video2_ds
      sync: false
      async: false
  edges:
    src0: mux
    src1: mux
    mux: pgie
    pgie: analyzer
    analyzer: demux
    queue_demux0: nvvidconv0
    nvvidconv0: tee_raw0
    tee_raw0:
    - queue_raw0
    - osd0
    queue_raw0: appsink_raw0
    osd0: tee_vis0
    tee_vis0:
    - queue_vis0
    - queue_enc0
    queue_vis0: appsink_vis0
    queue_enc0: encoder0
    encoder0: h264parse0
    h264parse0: sink0
    queue_demux1: nvvidconv1
    nvvidconv1: tee_raw1
    tee_raw1:
    - queue_raw1
    - osd1
    queue_raw1: appsink_raw1
    osd1: tee_vis1
    tee_vis1:
    - queue_vis1
    - queue_enc1
    queue_vis1: appsink_vis1
    queue_enc1: encoder1
    encoder1: h264parse1
    h264parse1: sink1
