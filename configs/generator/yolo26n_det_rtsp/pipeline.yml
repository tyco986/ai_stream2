deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin0
    properties:
      uri: rtsp://ai_stream2_mediamtx:8554/video1
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvurisrcbin
    name: nvurisrcbin1
    properties:
      uri: rtsp://ai_stream2_mediamtx:8554/video2
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 2
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: true
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo26n_det_rtsp/pgie.yml
      batch-size: 2
      gpu-id: 0
  - type: nvtracker
    name: nvtracker
    properties:
      ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
      ll-config-file: /root/configs/generator/yolo26n_det_rtsp/nvtracker.yml
      tracker-width: 1920
      tracker-height: 1056
      gpu-id: 0
      operate-on-class-ids: '0'
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/yolo26n_det_rtsp/nvdsanalytics.yml
      gpu-id: 0
  - type: tee
    name: tee_msg
  - type: queue
    name: queue_msg
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvmsgconv
    name: nvmsgconv
    properties:
      config: /root/configs/generator/yolo26n_det_rtsp/nvmsgconv.yml
      payload-type: 1
      msg2p-newapi: true
      frame-interval: 1
  - type: nvmsgbroker
    name: nvmsgbroker
    properties:
      proto-lib: /opt/nvidia/deepstream/deepstream/lib/libnvds_kafka_proto.so
      conn-str: ai_stream2_kafka;9092
      topic: ai_stream2_yolo26n_det_rtsp
      config: /root/configs/generator/yolo26n_det_rtsp/kafka.txt
      sync: false
      async: false
  - type: nvstreamdemux
    name: nvstreamdemux
  - type: queue
    name: queue_demux0
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvdetlogger
    name: nvdetlogger0
    properties:
      root: /root/logs/deepstream/yolo26n_det_rtsp
      interval: 50
  - type: fakesink
    name: fakesink0
    properties:
      sync: false
      async: false
  - type: queue
    name: queue_demux1
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvdetlogger
    name: nvdetlogger1
    properties:
      root: /root/logs/deepstream/yolo26n_det_rtsp
      interval: 50
  - type: fakesink
    name: fakesink1
    properties:
      sync: false
      async: false
  edges:
    nvurisrcbin0: nvstreammux
    nvurisrcbin1: nvstreammux
    nvstreammux: pgie
    pgie: nvtracker
    nvtracker: nvdsanalytics
    nvdsanalytics: tee_msg
    tee_msg:
    - nvstreamdemux
    - queue_msg
    queue_msg: nvmsgconv
    nvmsgconv: nvmsgbroker
    queue_demux0: nvdetlogger0
    nvdetlogger0: fakesink0
    queue_demux1: nvdetlogger1
    nvdetlogger1: fakesink1
