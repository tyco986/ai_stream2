generator: StgcnppSahiVideoGenerator
input: /root/attachments/videos/video1.mp4
output: /root/outputs/deepstream/stgcnpp_sahi_video_with_tracker.mp4
pgie:
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
  interval: 50
analyzer: null
tracker:
  class_id: 0
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
sgie:
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
  interval: 0
stgcnpp:
  model_dir: /root/models/trt/stgcnpp-ntu60
  interval: 0
config_save_dir: /root/configs/generator/stgcnpp_sahi_video_with_tracker
