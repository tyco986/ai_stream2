deepstream:
  nodes:
  - type: nvurisrcbin
    name: src
    properties:
      uri: file:///root/attachments/videos/video1.mp4
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: mux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo11n_pose_video/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvdsanalytics
    name: analyzer
    properties:
      config-file: /root/configs/generator/yolo11n_pose_video/nvdsanalytics.yml
      gpu-id: 0
  - type: nvosdbin
    name: osd
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: nvvideoconvert
    name: nvvidconv
    properties:
      gpu-id: 0
  - type: nvv4l2h264enc
    name: encoder
    properties:
      bitrate: 4000000
      iframeinterval: 25
      preset-id: 1
      gpu-id: 0
  - type: h264parse
    name: h264parse
  - type: mp4mux
    name: mp4mux
  - type: filesink
    name: sink
    properties:
      location: /root/outputs/deepstream/yolo11n_pose_video.mp4
      sync: false
      async: false
  edges:
    src: mux
    mux: pgie
    pgie: analyzer
    analyzer: osd
    osd: nvvidconv
    nvvidconv: encoder
    encoder: h264parse
    h264parse: mp4mux
    mp4mux: sink
