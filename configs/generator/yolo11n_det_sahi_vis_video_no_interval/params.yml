generator: DetSahiVisVideoGenerator
input: /root/attachments/videos/video1.mp4
pgie:
  model_dir: /root/models/trt/yolo11n
  class_attrs:
    all:
      conf: 0.25
  interval: 1
analyzer: null
tracker: null
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess:
    match_threshold: 0.5
output: /root/outputs/deepstream/yolo11n_det_sahi_vis_video_no_interval.mp4
config_save_dir: /root/configs/generator/yolo11n_det_sahi_vis_video_no_interval
