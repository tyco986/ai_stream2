pipeline_name: topdown_pose_sahi_vis_video_no_interval
generator: TopdownPoseSahiVisVideoGenerator
input: /root/attachments/videos/video1.mp4
pgie:
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
  interval: 1
analyzer: null
tracker: null
logger:
  interval: 1
  root: /root/logs/deepstream/topdown_pose_sahi_vis_video_no_interval
drawer:
  interval: 1
  fade_time: 1
  show_label: true
  show_pose: true
  pose_threshold: 0.0
  mode: coco17
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
output: /root/outputs/deepstream/topdown_pose_sahi_vis_video_no_interval.mp4
sgie:
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
  interval: 1
