deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin
    properties:
      uri: file:///root/attachments/images/video1.png
      disable-audio: true
      select-rtp-protocol: 4
      num-buffers: 1
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo10x_smoke_fire_image/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/yolo10x_smoke_fire_image/nvdsanalytics.yml
      gpu-id: 0
  - type: nvpresencecoder
    name: nvpresencecoder
    properties:
      class-ids: 0;1
      event-names: Fire;Smoke
      length: 1
      threshold: 0.5
      mode: fold
  - type: tee
    name: tee_msg
  - type: queue
    name: queue_msg
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvmsgconv
    name: nvmsgconv
    properties:
      config: /root/configs/generator/yolo10x_smoke_fire_image/nvmsgconv.yml
      payload-type: 1
      msg2p-newapi: true
      frame-interval: 1
  - type: nvmsgbroker
    name: nvmsgbroker
    properties:
      proto-lib: /opt/nvidia/deepstream/deepstream/lib/libnvds_kafka_proto.so
      conn-str: ai_stream2_kafka;9092
      topic: ai_stream2_yolo10x_smoke_fire_image
      config: /root/configs/generator/yolo10x_smoke_fire_image/kafka.txt
      sync: false
      async: false
  - type: nvvideoconvert
    name: nvvideoconvert
    properties:
      gpu-id: 0
  - type: tee
    name: tee_raw
  - type: queue
    name: queue_raw
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_raw
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_raw
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: nvrawcapturer
    name: nvrawcapturer0
    properties:
      output-dir: /root/outputs/deepstream/yolo10x_smoke_fire_image
      capture-codes: '1'
  - type: fakesink
    name: fakesink_raw0
    properties:
      sync: false
      async: false
  - type: queue
    name: queue_osd
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_osd
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_osd
    properties:
      caps: video/x-raw(memory:NVMM), format=RGBA
  - type: nvdetfadedrawer
    name: nvdetfadedrawer
    properties:
      interval: 50
      fade-time: 1
      show-label: true
  - type: nvosdbin
    name: nvosdbin
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: tee
    name: tee_vis
  - type: queue
    name: queue_vis
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_vis
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_vis
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: queue
    name: queue_enc
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvpresencelogger
    name: nvpresencelogger
    properties:
      root: /root/logs/deepstream/yolo10x_smoke_fire_image
      interval: 50
  - type: nvviscapturer
    name: nvviscapturer0
    properties:
      output-dir: /root/outputs/deepstream/yolo10x_smoke_fire_image
      capture-codes: '1'
      label-task: det
  - type: fakesink
    name: fakesink_vis0
    properties:
      sync: false
      async: false
  - type: nvvideoconvert
    name: nvvideoconvert_enc
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_jpeg
    properties:
      caps: video/x-raw(memory:NVMM), format=I420
  - type: nvjpegenc
    name: nvjpegenc
    properties:
      quality: 85
  - type: filesink
    name: filesink
    properties:
      location: /root/outputs/deepstream/yolo10x_smoke_fire_image.jpg
      sync: false
      async: false
  edges:
    nvurisrcbin: nvstreammux
    nvstreammux: pgie
    pgie: nvdsanalytics
    nvdsanalytics: nvpresencecoder
    nvpresencecoder: tee_msg
    tee_msg:
    - nvvideoconvert
    - queue_msg
    queue_msg: nvmsgconv
    nvmsgconv: nvmsgbroker
    nvvideoconvert: tee_raw
    tee_raw:
    - queue_raw
    - queue_osd
    queue_raw: nvvideoconvert_raw
    nvvideoconvert_raw: capsfilter_raw
    capsfilter_raw: nvrawcapturer0
    nvrawcapturer0: fakesink_raw0
    queue_osd: nvvideoconvert_osd
    nvvideoconvert_osd: capsfilter_osd
    capsfilter_osd: nvdetfadedrawer
    nvdetfadedrawer: nvosdbin
    nvosdbin: tee_vis
    tee_vis:
    - queue_vis
    - queue_enc
    queue_vis: nvvideoconvert_vis
    nvvideoconvert_vis: capsfilter_vis
    capsfilter_vis: nvviscapturer0
    nvviscapturer0: fakesink_vis0
    queue_enc: nvvideoconvert_enc
    nvvideoconvert_enc: capsfilter_jpeg
    capsfilter_jpeg: nvpresencelogger
    nvpresencelogger: nvjpegenc
    nvjpegenc: filesink
