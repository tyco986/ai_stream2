pipeline_name: yolo11n_seg_sahi_image
type: SegSahiImagePipeline
generator: SegSahiImageGenerator
input: /root/attachments/images/video1.png
output: /root/outputs/deepstream/yolo11n_seg_sahi_image.jpg
pgie:
  model_dir: /root/models/trt/yolo11n-seg
  class_attrs:
    all:
      conf: 0.25
  interval: 50
analyzer: null
logger:
  interval: 50
  root: /root/logs/deepstream/yolo11n_seg_sahi_image
drawer:
  interval: 50
  fade_time: 1
  show_label: true
  show_mask: true
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess:
    match_threshold: 0.5
