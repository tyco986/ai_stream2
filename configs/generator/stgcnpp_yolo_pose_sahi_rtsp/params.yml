pipeline_name: stgcnpp_yolo_pose_sahi_rtsp
streams:
  video1:
    url: rtsp://ai_stream2_mediamtx:8554/video1
    width: 1920
    height: 1080
    fps: 25
  video2:
    url: rtsp://ai_stream2_mediamtx:8554/video2
    width: 1920
    height: 1080
    fps: 25
generator: StgcnppYoloPoseSahiRTSPGenerator
pgie:
  model_dir: /root/models/trt/yolo26n-pose
  class_attrs:
    all:
      conf: 0.4
  interval: 1
analyzer: null
tracker:
  class_id: 0
logger:
  interval: 1
  root: /root/logs/deepstream/stgcnpp_yolo_pose_sahi_rtsp
drawer: null
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess_pose:
    oks_threshold: 0.5
stgcnpp:
  model_dir: /root/models/trt/stgcnpp-ntu60
  interval: 1
