deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin
    properties:
      uri: file:///root/attachments/videos/video1.mp4
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/topdown_pose_video/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvinfer
    name: sgie0
    properties:
      config-file-path: /root/configs/generator/topdown_pose_video/sgie0.yml
      batch-size: 64
      gpu-id: 0
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/topdown_pose_video/nvdsanalytics.yml
      gpu-id: 0
  - type: nvvideoconvert
    name: nvvideoconvert
    properties:
      gpu-id: 0
  - type: fakesink
    name: fakesink
    properties:
      sync: false
      async: false
  edges:
    nvurisrcbin: nvstreammux
    nvstreammux: pgie
    pgie: sgie0
    sgie0: nvdsanalytics
    nvdsanalytics: nvvideoconvert
    nvvideoconvert: fakesink
