deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin
    properties:
      uri: file:///root/attachments/videos/video1.mp4
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/topdown_pose_video/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvdspreprocess
    name: nvdspreprocess_rtmpose
    properties:
      config-file: /root/configs/generator/topdown_pose_video/nvdspreprocess_rtmpose.txt
  - type: nvinfer
    name: sgie0
    properties:
      config-file-path: /root/configs/generator/topdown_pose_video/sgie0.yml
      batch-size: 64
      gpu-id: 0
      input-tensor-meta: true
      clip-object-outside-roi: false
  - type: nvrtmposepostprocess
    name: nvrtmposepostprocess
    properties:
      infer-width: 192
      infer-height: 256
      padding: 1.25
      sgie-unique-id: 2
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/topdown_pose_video/nvdsanalytics.yml
      gpu-id: 0
  - type: tee
    name: tee_msg
    properties: {}
  - type: queue
    name: queue_msg
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvmsgconv
    name: nvmsgconv
    properties:
      config: /root/configs/generator/topdown_pose_video/nvmsgconv.yml
      payload-type: 1
      msg2p-newapi: true
      frame-interval: 1
  - type: nvmsgbroker
    name: nvmsgbroker
    properties:
      proto-lib: /opt/nvidia/deepstream/deepstream/lib/libnvds_kafka_proto.so
      conn-str: ai_stream2_kafka;9092
      topic: ai_stream2_topdown_pose_video
      config: /root/configs/generator/topdown_pose_video/kafka.txt
      sync: false
      async: false
  - type: nvdetlogger
    name: nvdetlogger
    properties:
      root: /root/logs/deepstream/topdown_pose_video
      interval: 50
  - type: fakesink
    name: fakesink
    properties:
      sync: false
      async: false
  edges:
    nvurisrcbin: nvstreammux
    nvstreammux: pgie
    pgie: nvdspreprocess_rtmpose
    nvdspreprocess_rtmpose: sgie0
    sgie0: nvrtmposepostprocess
    nvrtmposepostprocess: nvdsanalytics
    nvdsanalytics: tee_msg
    tee_msg:
    - nvdetlogger
    - queue_msg
    queue_msg: nvmsgconv
    nvmsgconv: nvmsgbroker
    nvdetlogger: fakesink
