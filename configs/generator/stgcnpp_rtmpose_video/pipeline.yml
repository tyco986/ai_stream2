deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin
    properties:
      uri: file:///root/attachments/videos/video1.mp4
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/stgcnpp_rtmpose_video/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvtracker
    name: nvtracker
    properties:
      ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
      ll-config-file: /root/configs/generator/stgcnpp_rtmpose_video/nvtracker.yml
      tracker-width: 1920
      tracker-height: 1056
      gpu-id: 0
      operate-on-class-ids: '0'
  - type: nvdspreprocess
    name: nvdspreprocess_rtmpose
    properties:
      config-file: /root/configs/generator/stgcnpp_rtmpose_video/nvdspreprocess_rtmpose.txt
  - type: nvinfer
    name: sgie0
    properties:
      config-file-path: /root/configs/generator/stgcnpp_rtmpose_video/sgie0.yml
      batch-size: 64
      gpu-id: 0
      input-tensor-meta: true
      clip-object-outside-roi: false
  - type: nvrtmposepostprocess
    name: nvrtmposepostprocess
    properties:
      sgie-unique-id: 2
  - type: nvdspreprocess
    name: nvdspreprocess
    properties:
      config-file: /root/configs/generator/stgcnpp_rtmpose_video/preprocess_stgcnpp.txt
  - type: nvinfer
    name: sgie1
    properties:
      config-file-path: /root/configs/generator/stgcnpp_rtmpose_video/sgie1.yml
      batch-size: 64
      gpu-id: 0
      input-tensor-meta: true
      clip-object-outside-roi: false
  - type: nvstgcnppactionlabel
    name: nvstgcnppactionlabel
    properties:
      classifier-unique-id: 4
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/stgcnpp_rtmpose_video/nvdsanalytics.yml
      gpu-id: 0
  - type: tee
    name: tee_msg
    properties: {}
  - type: queue
    name: queue_msg
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvmsgconv
    name: nvmsgconv
    properties:
      config: /root/configs/generator/stgcnpp_rtmpose_video/nvmsgconv.yml
      payload-type: 1
      msg2p-newapi: true
      frame-interval: 1
  - type: nvmsgbroker
    name: nvmsgbroker
    properties:
      proto-lib: /opt/nvidia/deepstream/deepstream/lib/libnvds_kafka_proto.so
      conn-str: ai_stream2_kafka;9092
      topic: ai_stream2_stgcnpp_rtmpose_video
      config: /root/configs/generator/stgcnpp_rtmpose_video/kafka.txt
      sync: false
      async: false
  - type: nvstgcnpplogger
    name: nvstgcnpplogger
    properties:
      root: /root/logs/deepstream/stgcnpp_rtmpose_video
      interval: 1
  - type: fakesink
    name: fakesink
    properties:
      sync: false
      async: false
  edges:
    nvurisrcbin: nvstreammux
    nvstreammux: pgie
    pgie: nvtracker
    nvtracker: nvdspreprocess_rtmpose
    nvdspreprocess_rtmpose: sgie0
    sgie0: nvrtmposepostprocess
    nvrtmposepostprocess: nvdspreprocess
    nvdspreprocess: sgie1
    sgie1: nvstgcnppactionlabel
    nvstgcnppactionlabel: nvdsanalytics
    nvdsanalytics: tee_msg
    tee_msg:
    - nvstgcnpplogger
    - queue_msg
    queue_msg: nvmsgconv
    nvmsgconv: nvmsgbroker
    nvstgcnpplogger: fakesink
