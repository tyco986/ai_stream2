deepstream:
  nodes:
  - type: nvurisrcbin
    name: nvurisrcbin
    properties:
      uri: file:///root/attachments/videos/video2.mp4
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: nvstreammux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo10x_smoke_fire_vis_video/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvdsanalytics
    name: nvdsanalytics
    properties:
      config-file: /root/configs/generator/yolo10x_smoke_fire_vis_video/nvdsanalytics.yml
      gpu-id: 0
  - type: nvvideoconvert
    name: nvvideoconvert
    properties:
      gpu-id: 0
  - type: tee
    name: tee_raw
  - type: queue
    name: queue_raw
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_raw
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_raw
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: appsink
    name: appsink_raw0
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
      async: false
  - type: queue
    name: queue_osd
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_osd
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_osd
    properties:
      caps: video/x-raw(memory:NVMM), format=RGBA
  - type: nvosdbin
    name: nvosdbin
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: tee
    name: tee_vis
  - type: queue
    name: queue_vis
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvideoconvert_vis
    properties:
      gpu-id: 0
  - type: capsfilter
    name: capsfilter_vis
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: queue
    name: queue_enc
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: appsink
    name: appsink_vis0
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
      async: false
  - type: nvv4l2h264enc
    name: nvv4l2h264enc
    properties:
      bitrate: 4000000
      iframeinterval: 25
      preset-id: 1
      gpu-id: 0
  - type: h264parse
    name: h264parse
  - type: mp4mux
    name: mp4mux
  - type: filesink
    name: filesink
    properties:
      location: /root/outputs/deepstream/yolo10x_smoke_fire_vis_video.mp4
      sync: false
      async: false
  edges:
    nvurisrcbin: nvstreammux
    nvstreammux: pgie
    pgie: nvdsanalytics
    nvdsanalytics: nvvideoconvert
    nvvideoconvert: tee_raw
    tee_raw:
    - queue_raw
    - queue_osd
    queue_raw: nvvideoconvert_raw
    nvvideoconvert_raw: capsfilter_raw
    capsfilter_raw: appsink_raw0
    queue_osd: nvvideoconvert_osd
    nvvideoconvert_osd: capsfilter_osd
    capsfilter_osd: nvosdbin
    nvosdbin: tee_vis
    tee_vis:
    - queue_vis
    - queue_enc
    queue_vis: nvvideoconvert_vis
    nvvideoconvert_vis: capsfilter_vis
    capsfilter_vis: appsink_vis0
    queue_enc: nvv4l2h264enc
    nvv4l2h264enc: h264parse
    h264parse: mp4mux
    mp4mux: filesink
