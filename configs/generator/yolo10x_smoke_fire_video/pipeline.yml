deepstream:
  nodes:
  - type: nvurisrcbin
    name: src
    properties:
      uri: file:///root/attachments/videos/video2.mp4
      disable-audio: true
      select-rtp-protocol: 4
  - type: nvstreammux
    name: mux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo10x_smoke_fire_video/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvdsanalytics
    name: analyzer
    properties:
      config-file: /root/configs/generator/yolo10x_smoke_fire_video/nvdsanalytics.yml
      gpu-id: 0
  - type: nvvideoconvert
    name: nvvidconv
    properties:
      gpu-id: 0
  - type: tee
    name: tee_raw
  - type: queue
    name: queue_raw
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvidconv_raw
    properties:
      gpu-id: 0
  - type: capsfilter
    name: caps_raw
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: appsink
    name: appsink_raw0
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
      async: false
  - type: queue
    name: queue_osd
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvidconv_osd
    properties:
      gpu-id: 0
  - type: capsfilter
    name: caps_osd
    properties:
      caps: video/x-raw(memory:NVMM), format=RGBA
  - type: nvosdbin
    name: osd
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: tee
    name: tee_vis
  - type: queue
    name: queue_vis
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: nvvideoconvert
    name: nvvidconv_vis
    properties:
      gpu-id: 0
  - type: capsfilter
    name: caps_vis
    properties:
      caps: video/x-raw(memory:NVMM), format=RGB
  - type: queue
    name: queue_enc
    properties:
      leaky: 2
      max-size-buffers: 4
  - type: appsink
    name: appsink_vis0
    properties:
      emit-signals: true
      sync: false
      max-buffers: 1
      drop: true
      async: false
  - type: nvv4l2h264enc
    name: encoder
    properties:
      bitrate: 4000000
      iframeinterval: 25
      preset-id: 1
      gpu-id: 0
  - type: h264parse
    name: h264parse
  - type: mp4mux
    name: mp4mux
  - type: filesink
    name: sink
    properties:
      location: /root/outputs/deepstream/yolo10x_smoke_fire_video.mp4
      sync: false
      async: false
  edges:
    src: mux
    mux: pgie
    pgie: analyzer
    analyzer: nvvidconv
    nvvidconv: tee_raw
    tee_raw:
    - queue_raw
    - queue_osd
    queue_raw: nvvidconv_raw
    nvvidconv_raw: caps_raw
    caps_raw: appsink_raw0
    queue_osd: nvvidconv_osd
    nvvidconv_osd: caps_osd
    caps_osd: osd
    osd: tee_vis
    tee_vis:
    - queue_vis
    - queue_enc
    queue_vis: nvvidconv_vis
    nvvidconv_vis: caps_vis
    caps_vis: appsink_vis0
    queue_enc: encoder
    encoder: h264parse
    h264parse: mp4mux
    mp4mux: sink
