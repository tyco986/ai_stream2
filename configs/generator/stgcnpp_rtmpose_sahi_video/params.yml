pipeline_name: stgcnpp_rtmpose_sahi_video
generator: StgcnppRtmposeSahiVideoGenerator
input: /root/attachments/videos/video1.mp4
pgie:
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
  interval: 50
analyzer: null
tracker:
  class_id: 0
logger:
  interval: 1
  root: /root/logs/deepstream/stgcnpp_rtmpose_sahi_video
drawer: null
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
sgie:
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
  interval: 1
stgcnpp:
  model_dir: /root/models/trt/stgcnpp-ntu60
  interval: 1
