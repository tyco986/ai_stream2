generator: TopdownPoseSahiVisVideoGenerator
input: /root/attachments/videos/video1.mp4
pgie:
  model_dir: /root/models/trt/yolo26n
  class_attrs:
    0:
      conf: 0.25
  interval: 50
analyzer: null
tracker: null
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
    enable_full_frame: true
  nvsahipostprocess:
    match_threshold: 0.5
output: /root/outputs/deepstream/topdown_pose_sahi_vis_video.mp4
sgie:
  model_dir: /root/models/trt/rtmpose-s-coco-pruned
  interval: 50
config_save_dir: /root/configs/generator/topdown_pose_sahi_vis_video
