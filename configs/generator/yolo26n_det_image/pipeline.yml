deepstream:
  nodes:
  - type: nvurisrcbin
    name: src
    properties:
      uri: file:///root/attachments/images/test.png
      disable-audio: true
      select-rtp-protocol: 4
      num-buffers: 1
  - type: nvstreammux
    name: mux
    properties:
      batch-size: 1
      width: 1920
      height: 1080
      enable-padding: false
      batched-push-timeout: 40000
      gpu-id: 0
      live-source: false
  - type: nvinfer
    name: pgie
    properties:
      config-file-path: /root/configs/generator/yolo26n_det_image/pgie.yml
      batch-size: 1
      gpu-id: 0
  - type: nvosdbin
    name: osd
    properties:
      gpu-id: 0
      display-bbox: true
      display-text: true
      display-mask: false
  - type: nvvideoconvert
    name: nvvidconv
    properties:
      gpu-id: 0
  - type: nvjpegenc
    name: jpegenc
    properties:
      quality: 85
  - type: filesink
    name: sink
    properties:
      location: /root/outputs/deepstream/yolo26n_det_image.jpg
      sync: false
      async: false
  edges:
    src: mux
    mux: pgie
    pgie: osd
    osd: nvvidconv
    nvvidconv: jpegenc
    jpegenc: sink
