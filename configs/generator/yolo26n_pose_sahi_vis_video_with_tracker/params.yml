generator: PoseSahiVisVideoGenerator
input: /root/attachments/videos/video1.mp4
pgie:
  model_dir: /root/models/trt/yolo26n-pose
  class_attrs:
    all:
      conf: 0.25
  interval: 50
analyzer: null
tracker:
  class_id: 0
sahi:
  nvsahipreprocess:
    slice_width: 640
    slice_height: 640
    overlap_width_ratio: 0.2
    overlap_height_ratio: 0.2
  nvsahipostprocess_pose:
    oks_threshold: 0.5
output: /root/outputs/deepstream/yolo26n_pose_sahi_vis_video_with_tracker.mp4
config_save_dir: /root/configs/generator/yolo26n_pose_sahi_vis_video_with_tracker
